name: Deploy Lean learning site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - verification/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://phonchi.github.io
      BASE_PATH: /lean-ai-learning/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and upload static site
        uses: withastro/action@v6
        with:
          node-version: 24
      - name: Check Astro types
        run: npm run check

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
